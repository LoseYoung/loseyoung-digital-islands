name: Cloud review snapshot
on:
  push:
    branches: [feat/interactive-journeys]
    paths: [.github/workflows/cloud-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: 生成云端源码检查快照
        run: tar --exclude=.git -czf "$RUNNER_TEMP/cloud-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-review-source
          path: ${{ runner.temp }}/cloud-source.tar.gz
          retention-days: 1
